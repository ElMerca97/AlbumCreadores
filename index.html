<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071321">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Selección de Maldonado de Creadores</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menú">☰</button>
      <div class="brand">
        <div class="mini-crest">⚽</div>
        <div>
          <div class="eyebrow">ÁLBUM OFICIAL</div>
          <div class="brand-name">MALDONADO</div>
          <div class="brand-sub">DE CREADORES</div>
        </div>
      </div>
      <div class="wallet">
        <span>🪙</span><b id="coins">250</b><button id="addCoins">+</button>
      </div>
    </header>

    <main id="screen"></main>

    <nav class="bottom-nav" id="bottomNav">
      <button data-page="home"><span class="nav-icon">⌂</span><small>INICIO</small></button>
      <button data-page="album"><span class="nav-icon">▣</span><small>MI ÁLBUM</small></button>
      <button data-page="packs"><span class="nav-icon">✉</span><small>SOBRES</small></button>
      <button data-page="cards"><span class="nav-icon">▤</span><small>MIS CROMOS</small></button>
      <button data-page="challenges"><span class="nav-icon">♜</span><small>RETOS</small></button>
      <button data-page="team"><span class="nav-icon">⚽</span><small>MI EQUIPO</small></button>
    </nav>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer">
    <button class="drawer-close" id="drawerClose">×</button>
    <div class="drawer-title">SELECCIÓN DE<br><strong>MALDONADO</strong><br>DE CREADORES</div>
    <div class="drawer-links">
      <button data-page="home">⌂ Inicio</button>
      <button data-page="album">▣ Mi Álbum</button>
      <button data-page="packs">✉ Sobres</button>
      <button data-page="cards">▤ Mis Cromos</button>
      <button data-page="challenges">♜ Retos</button>
      <button data-page="team">⚽ Mi Equipo</button>
      <button id="resetProgress">↻ Reiniciar progreso</button>
    </div>
  </aside>

  <div class="modal" id="modal">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
